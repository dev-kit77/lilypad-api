name: Integration Tests (Docker stack)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_API_BASE: http://127.0.0.1:3000
      TEST_ADMIN_PROMOTE_SECRET: lilypad-local-test-promote-only

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start app + Postgres
        run: docker compose up -d --build

      - name: Wait for API readiness
        run: |
          for i in {1..60}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/user || true)
            if [ "$code" = "401" ]; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in time"
          docker compose logs
          exit 1

      - name: Run integration tests
        run: bun test

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color > compose.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose.log

      - name: Teardown
        if: always()
        run: docker compose down -v
